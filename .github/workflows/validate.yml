name: Validate workshop notebook
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_notebook.py --execute
      - uses: actions/upload-artifact@v4
        with:
          name: executed-workshop
          path: artifacts/executed-workshop.ipynb
